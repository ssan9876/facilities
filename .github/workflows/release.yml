name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: facilities
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: facilities_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U facilities -d facilities_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://facilities:integration-test@localhost:5432/facilities_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_hosting.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t facilities:release .
      - name: Package verified source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          git archive --format=tar --prefix=facilities/ "$TAG" | gzip -n > facilities.tar.gz
          sha256sum facilities.tar.gz > SHA256SUMS
      - name: Verify archived release serves the frontend
        run: bash scripts/release-smoke.sh facilities.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" facilities.tar.gz SHA256SUMS --verify-tag --generate-notes
