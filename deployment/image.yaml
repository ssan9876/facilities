services:
  app:
    image: ${FACILITIES_IMAGE:?Set FACILITIES_IMAGE}
    environment:
      RELEASE_REPOSITORY: ${RELEASE_REPOSITORY:-ssan9876/facilities}
      UPDATE_DIR: /updates
    # Shared with the host update agent: the app writes request.json and reads status.json.
    volumes:
      - ${FACILITIES_HOME:-/opt/facilities}/run:/updates
