# Replace the IP with the installation's hostname and supply its TLS certificate.
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /etc/nginx/tls/facilities.crt;
  ssl_certificate_key /etc/nginx/tls/facilities.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # Attachments are uploaded through the application; keep this above ATTACHMENT_MAX_MB.
  client_max_body_size 12m;
  # Metrics need METRICS_TOKEN; scrape them on the host at 127.0.0.1:3000 rather than through this proxy.
  location = /metrics { deny all; }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
